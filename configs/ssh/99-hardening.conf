# /etc/ssh/sshd_config.d/99-hardening.conf
# ПР5: hardening SSH. После применения: sudo systemctl reload ssh
#
# До hardening порт был 22; после — 2222.
# В VirtualBox: Adapter1 NAT, проброс host 2222 → guest 2222.

Port 2222
PermitRootLogin no
PasswordAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
AllowUsers devops
X11Forwarding no
AllowTcpForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
